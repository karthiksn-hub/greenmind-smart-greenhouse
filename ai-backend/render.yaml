
services:
  - type: web
    name: greenmind-ai-backend
    runtime: python
    plan: starter
    rootDir: ai-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PLANT_MODEL_NAME
        value: neghani/plantvillage-mobilenetv2
